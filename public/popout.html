<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>kScreen</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- A stream popped out of the room (main.js fills it: same MediaStream, no new connection). -->
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      body { font: 500 15px Inter, system-ui, sans-serif; color: #b5bac1; }
      video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
      .msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <video id="popout-video" autoplay playsinline muted></video>
    <div class="msg hidden" id="popout-msg"></div>
  </body>
</html>

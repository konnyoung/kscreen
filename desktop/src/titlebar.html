<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'">
<title>kScreen</title>
<link rel="stylesheet" href="brand.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: #0b0c0e;
    color: #9a9ba5;
    font: 13px/1 'Inter', 'Segoe UI', system-ui, sans-serif;
    user-select: none;
  }
  .bar {
    height: 32px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    -webkit-app-region: drag;
  }
  .logo {
    padding-left: 14px;
    font-family: 'K2D', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.3px;
    color: #f2f2f5;
  }
  .logo .k { color: #F53F5F; }
  .title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 500;
    color: #c4c5cc;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .title .code { font-family: 'IBM Plex Mono', Consolas, monospace; letter-spacing: 0.3px; }
  body.blurred .title, body.blurred .logo { opacity: 0.55; }
  .controls { justify-self: end; display: flex; height: 32px; -webkit-app-region: no-drag; }
  .controls button {
    width: 46px;
    height: 32px;
    display: grid;
    place-items: center;
    border: 0;
    background: transparent;
    color: #9a9ba5;
    cursor: default;
  }
  .controls button:hover { background: #1c1d22; color: #f2f2f5; }
  .controls button:active { background: #26272e; }
  .controls #close:hover { background: #e5323d; color: #fff; }
  .controls #close:active { background: #c42b35; }
  .controls svg { width: 10px; height: 10px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="bar">
    <div class="logo"><span class="k">k</span>Screen</div>
    <div class="title" id="title"></div>
    <div class="controls">
      <button id="minimize" title="Minimizar" aria-label="Minimizar">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5.5h10" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button id="maximize" title="Maximizar" aria-label="Maximizar">
        <svg class="max" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg>
        <svg class="restore hidden" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 2.5V0.5h7v7h-2" fill="none" stroke="currentColor" stroke-width="1"/><rect x="0.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button id="close" title="Fechar" aria-label="Fechar">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9" stroke="currentColor" stroke-width="1.1"/></svg>
      </button>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="titlebar.js"></script>
</body>
</html>
